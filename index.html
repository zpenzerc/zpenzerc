<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Web Experience</title>
  <style>
    /* =========================================================
       1. GLOBAL RESET & CYBERPUNK VARIABLES (No Purple/No Pink)
       ========================================================= */
    :root {
      --bg-dark: #07090d;
      --cyber-cyan: #00f0ff;
      --cyber-yellow: #ffe600;
      --cyber-green: #00ff66;
      --text-main: #f0f6fc;
      --slant-angle: 8deg;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* =========================================================
       2. INTRO OVERLAY ("別把真心錯付")
       ========================================================= */
    #intro-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .intro-text {
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 6px;
      opacity: 0;
      animation: fadeInHoldOut 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    @keyframes fadeInHoldOut {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      25% {
        opacity: 1;
        transform: scale(1);
      }
      75% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.04);
      }
    }

    .hide-intro {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================================================
       3. SECTION 1: SLANTED 3-PART SPLIT SECTION
       ========================================================= */
    .section-one {
      width: 100vw;
      min-height: 100vh;
      position: relative;
      background: #020305;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 0;
      overflow: hidden;
    }

    .section-header {
      text-align: center;
      margin-bottom: 40px;
      z-index: 10;
    }

    .section-header h1 {
      font-size: 2.8rem;
      color: var(--cyber-cyan);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .section-header p {
      font-size: 0.95rem;
      color: var(--cyber-yellow);
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .slanted-container {
      display: flex;
      width: 120vw;
      margin-left: -10vw; /* Compensate for width expansion */
      height: 65vh;
      overflow: hidden;
      position: relative;
    }

    .slant-panel {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      transform: skewX(calc(-1 * var(--slant-angle)));
      border-left: 2px solid var(--cyber-cyan);
      border-right: 2px solid var(--cyber-cyan);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.2);
      background: #000;
    }

    .slant-panel:first-child {
      border-left: none;
    }

    .slant-panel:last-child {
      border-right: none;
    }

    /* Counter-skew image to maintain normal orientation */
    .slant-panel .image-wrapper {
      width: 140%;
      height: 100%;
      position: absolute;
      left: -20%;
      top: 0;
      transform: skewX(var(--slant-angle));
      overflow: hidden;
    }

    .slant-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.6s ease;
      filter: grayscale(30%) brightness(0.85);
    }

    .slant-panel:hover img {
      transform: scale(1.15);
      filter: grayscale(0%) brightness(1.1);
    }

    .panel-caption {
      position: absolute;
      bottom: 20px;
      left: 20%;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 16px;
      border-left: 3px solid var(--cyber-yellow);
      color: var(--cyber-yellow);
      font-weight: bold;
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* =========================================================
       4. SECTION 2: 3D CYBERPUNK ROTATING CUBE
       ========================================================= */
    .section-two {
      width: 100vw;
      min-height: 100vh;
      background: radial-gradient(circle at center, #0e1520 0%, #03060a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      position: relative;
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }

    .cube-scene {
      width: 260px;
      height: 260px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 16s linear infinite;
    }

    @keyframes rotateCube {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }
      100% {
        transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
      }
    }

    .cube-face {
      position: absolute;
      width: 260px;
      height: 260px;
      background: rgba(4, 15, 25, 0.75);
      border: 2px solid var(--cyber-cyan);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: monospace;
      color: var(--cyber-cyan);
      text-shadow: 0 0 8px var(--cyber-cyan);
      backdrop-filter: blur(4px);
    }

    .cube-face::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(255, 230, 0, 0.4);
      pointer-events: none;
    }

    .face-front  { transform: rotateY(0deg) translateZ(130px); }
    .face-back   { transform: rotateY(180deg) translateZ(130px); }
    .face-right  { transform: rotateY(90deg) translateZ(130px); }
    .face-left   { transform: rotateY(-90deg) translateZ(130px); }
    .face-top    { transform: rotateX(90deg) translateZ(130px); }
    .face-bottom { transform: rotateX(-90deg) translateZ(130px); }

    .cube-face h3 {
      font-size: 1.3rem;
      letter-spacing: 2px;
      margin-bottom: 4px;
      color: #fff;
    }

    .cube-face p {
      font-size: 0.8rem;
      color: var(--cyber-yellow);
      letter-spacing: 1px;
    }

    /* =========================================================
       5. SECTION 3: PURE WHITE SECTION
       ========================================================= */
    .section-three {
      width: 100vw;
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-text">別把真心錯付</div>
  </div>

  <main>
    <section class="section-one">
      <div class="section-header">
        <h1>Cyber Division</h1>
        <p>Tactical visual database // Sector view</p>
      </div>

      <div class="slanted-container">
        <div class="slant-panel">
          <div class="image-wrapper">
            <img src="A.jpg" alt="A" onerror="this.src='https://picsum.photos/800/1000?random=1'" />
          </div>
          <div class="panel-caption">TARGET // A</div>
        </div>

        <div class="slant-panel">
          <div class="image-wrapper">
            <img src="B.jpg" alt="B" onerror="this.src='https://picsum.photos/800/1000?random=2'" />
          </div>
          <div class="panel-caption">TARGET // B</div>
        </div>

        <div class="slant-panel">
          <div class="image-wrapper">
            <img src="C.jpg" alt="C" onerror="this.src='https://picsum.photos/800/1000?random=3'" />
          </div>
          <div class="panel-caption">TARGET // C</div>
        </div>
      </div>
    </section>

    <section class="section-two">
      <div class="cube-scene">
        <div class="cube-face face-front">
          <h3>SYSTEM</h3>
          <p>[ONLINE]</p>
        </div>
        <div class="cube-face face-back">
          <h3>NODE</h3>
          <p>0x889F</p>
        </div>
        <div class="cube-face face-right">
          <h3>DATA</h3>
          <p>STREAM</p>
        </div>
        <div class="cube-face face-left">
          <h3>CORE</h3>
          <p>STABLE</p>
        </div>
        <div class="cube-face face-top">
          <h3>SECTOR</h3>
          <p>ALPHA</p>
        </div>
        <div class="cube-face face-bottom">
          <h3>CYBER</h3>
          <p>MATRIX</p>
        </div>
      </div>
    </section>

    <section class="section-three"></section>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const bgAudio = document.getElementById('bg-audio');

      // Helper function to play audio smoothly
      const startMusic = () => {
        bgAudio.play().catch(() => {
          // Fallback if browser blocks un-interacted autoplay: play on the very first user interaction
          const unlockAudio = () => {
            bgAudio.play();
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
          };
          document.addEventListener('click', unlockAudio);
          document.addEventListener('keydown', unlockAudio);
        });
      };

      // Fade away intro and start music right when entering the main page
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        intro.classList.add('hide-intro');
        startMusic();
      }, 3200);
    });
  </script>
<!-- Background Audio -->
  <audio id="bg-audio" src="A.mp3" loop preload="auto"></audio>
</body>
</html>
