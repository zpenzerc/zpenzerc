<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Web Experience</title>
  <style>
    /* =========================================================
       1. GLOBAL RESET & CYBERPUNK VARIABLES (No Purple/No Pink)
       ========================================================= */
    :root {
      --bg-dark: #07090d;
      --cyber-cyan: #00f0ff;
      --cyber-yellow: #ffe600;
      --cyber-green: #00ff66;
      --text-main: #f0f6fc;
      --slant-angle: 8deg;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* =========================================================
       2. INTRO OVERLAY ("別把真心錯付")
       ========================================================= */
    #intro-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .intro-text {
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 6px;
      opacity: 0;
      animation: fadeInHoldOut 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    @keyframes fadeInHoldOut {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      25% {
        opacity: 1;
        transform: scale(1);
      }
      75% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.04);
      }
    }

    .hide-intro {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================================================
       3. SECTION 1: SLANTED 3-PART SPLIT SECTION
       ========================================================= */
    .section-one {
      width: 100vw;
      min-height: 100vh;
      position: relative;
      background: #020305;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 0;
      overflow: hidden;
    }

    .section-header {
      text-align: center;
      margin-bottom: 40px;
      z-index: 10;
    }

    .section-header h1 {
      font-size: 2.8rem;
      color: var(--cyber-cyan);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .section-header p {
      font-size: 0.95rem;
      color: var(--cyber-yellow);
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .slanted-container {
      display: flex;
      width: 120vw;
      margin-left: -10vw; /* Compensate for width expansion */
      height: 65vh;
      overflow: hidden;
      position: relative;
    }

    /* MODIFIED: Added display: block and text-decoration: none for links */
    .slant-panel {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      transform: skewX(calc(-1 * var(--slant-angle)));
      border-left: 2px solid var(--cyber-cyan);
      border-right: 2px solid var(--cyber-cyan);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.2);
      background: #000;
      display: block;
      text-decoration: none;
    }

    .slant-panel:first-child {
      border-left: none;
    }

    .slant-panel:last-child {
      border-right: none;
    }

    /* Counter-skew image to maintain normal orientation */
    .slant-panel .image-wrapper {
      width: 140%;
      height: 100%;
      position: absolute;
      left: -20%;
      top: 0;
      transform: skewX(var(--slant-angle));
      overflow: hidden;
    }

    .slant-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.6s ease;
      filter: grayscale(30%) brightness(0.85);
    }

    .slant-panel:hover img {
      transform: scale(1.15);
      filter: grayscale(0%) brightness(1.1);
    }

    /* MODIFIED: Responsive layout and dynamic font sizing for all devices */
    .panel-caption {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 14px;
      border-left: 3px solid var(--cyber-yellow);
      color: var(--cyber-yellow);
      font-weight: bold;
      letter-spacing: 2px;
      pointer-events: none;
      white-space: nowrap;
      font-size: clamp(0.7rem, 2vw, 1rem);
      max-width: 90%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* =========================================================
       4. NEW SECTION 2: UNIVERSAL STARFIELD & CYBER TEXT BOX
       ========================================================= */
    .section-two {
      width: 100vw;
      min-height: 100vh;
      position: relative;
      background: #020509;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 40px 20px;
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }

    #starfield-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cyber-textbox-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 850px;
      background: rgba(7, 15, 25, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 4px;
      padding: 40px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15),
                  inset 0 0 20px rgba(0, 240, 255, 0.08);
      clip-path: polygon(
        0 0, 
        calc(100% - 20px) 0, 
        100% 20px, 
        100% 100%, 
        20px 100%, 
        0 calc(100% - 20px)
      );
    }

    .cyber-textbox-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-yellow), transparent);
    }

    .cyber-textbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .cyber-textbox-title {
      color: var(--cyber-cyan);
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }

    .cyber-textbox-tag {
      color: var(--cyber-yellow);
      font-size: 0.8rem;
      letter-spacing: 2px;
      background: rgba(255, 230, 0, 0.1);
      padding: 4px 8px;
      border: 1px solid rgba(255, 230, 0, 0.3);
    }

    .cyber-textbox-content {
      color: var(--text-main);
      font-size: 1.05rem;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    /* Editable or customizable inner content area */
    .cyber-textbox-content textarea {
      width: 100%;
      min-height: 200px;
      background: transparent;
      border: 1px dashed rgba(0, 240, 255, 0.3);
      color: var(--text-main);
      padding: 16px;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .cyber-textbox-content textarea:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    /* =========================================================
       5. NEW SECTION 3: FULLSCREEN IMAGE D.JPG & FOOTER GALLERY
       ========================================================= */
    .section-three {
      width: 100vw;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-image: url('D.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #000000;
      padding: 40px 20px;
    }

    .section-three-title {
      z-index: 2;
      text-align: center;
      color: var(--cyber-cyan);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      margin-top: 20px;
    }

    .gallery-footer {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 2;
      flex-wrap: wrap;
      background: rgba(2, 5, 9, 0.7);
      padding: 20px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .footer-box {
      width: 180px;
      height: 120px;
      position: relative;
      border: 2px solid var(--cyber-cyan);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      background: #000;
    }

    .footer-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
      filter: brightness(0.8);
    }

    .footer-box:hover {
      transform: translateY(-5px);
      border-color: var(--cyber-yellow);
      box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
    }

    .footer-box:hover img {
      transform: scale(1.1);
      filter: brightness(1.1);
    }

    .footer-box-label {
      position: absolute;
      bottom: 0;
      inset-x: 0;
      background: rgba(0, 0, 0, 0.8);
      color: var(--cyber-yellow);
      font-size: 0.85rem;
      text-align: center;
      padding: 4px 0;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Media query adjustments for mobile screens */
    @media (max-width: 600px) {
      .panel-caption {
        bottom: 12px;
        padding: 4px 8px;
        letter-spacing: 1px;
      }

      .footer-box {
        width: 100px;
        height: 75px;
      }

      .footer-box-label {
        font-size: 0.65rem;
        padding: 2px 0;
      }
    }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-text">別把真心錯付</div>
  </div>

  <main>
    <section class="section-one">
      <div class="section-header">
        <h1>昇辰的多重宇宙</h1>
        <p>出世無物帶來，死也無物帶走。匆匆一生，何懼之有？</p>
      </div>

      <div class="slanted-container">
        <a href="hingzone.html" class="slant-panel">
          <div class="image-wrapper">
            <img src="A1.jpg" alt="A" onerror="this.src='https://picsum.photos/800/1000?random=1'" />
          </div>
          <div class="panel-caption">昇辰賦</div>
        </a>

        <a href="events.html" class="slant-panel">
          <div class="image-wrapper">
            <img src="A2.jpg" alt="B" onerror="this.src='https://picsum.photos/800/1000?random=2'" />
          </div>
          <div class="panel-caption">活動流</div>
        </a>

        <a href="null.html" class="slant-panel">
          <div class="image-wrapper">
            <img src="A3.jpg" alt="C" onerror="this.src='https://picsum.photos/800/1000?random=3'" />
          </div>
          <div class="panel-caption">無一物</div>
        </a>
      </div>
    </section>

    <!-- NEW SECTION TWO -->
    <section class="section-two">
      <canvas id="starfield-canvas"></canvas>
      <div class="cyber-textbox-container">
        <div class="cyber-textbox-header">
          <div class="cyber-textbox-title">心事板</div>
          <div class="cyber-textbox-tag">STATUS: ACTIVE</div>
        </div>
        <div class="cyber-textbox-content">
          <textarea placeholder="留下你的心聲和煩惱，我們願意傾聽"></textarea>
        </div>
      </div>
    </section>

    <!-- NEW SECTION THREE -->
    <section class="section-three">
      <div class="section-three-title">
        <h2>旅遊集</h2>
      </div>

      <div class="gallery-footer">
        <a href="E1.jpg" target="_blank" class="footer-box">
          <img src="E1.jpg" alt="E1" onerror="this.src='https://picsum.photos/200/150?random=11'" />
          <div class="footer-box-label">春</div>
        </a>
        <a href="E2.jpg" target="_blank" class="footer-box">
          <img src="E2.jpg" alt="E2" onerror="this.src='https://picsum.photos/200/150?random=12'" />
          <div class="footer-box-label">夏</div>
        </a>
        <a href="E3.jpg" target="_blank" class="footer-box">
          <img src="E3.jpg" alt="E3" onerror="this.src='https://picsum.photos/200/150?random=13'" />
          <div class="footer-box-label">秋</div>
        </a>
        <a href="E4.jpg" target="_blank" class="footer-box">
          <img src="E4.jpg" alt="E4" onerror="this.src='https://picsum.photos/200/150?random=14'" />
          <div class="footer-box-label">冬</div>
        </a>
        <a href="E5.jpg" target="_blank" class="footer-box">
          <img src="E5.jpg" alt="E5" onerror="this.src='https://picsum.photos/200/150?random=15'" />
          <div class="footer-box-label">風</div>
        </a>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const bgAudio = document.getElementById('bg-audio');

      // Helper function to play audio smoothly
      const startMusic = () => {
        bgAudio.play().catch(() => {
          // Fallback if browser blocks un-interacted autoplay: play on the very first user interaction
          const unlockAudio = () => {
            bgAudio.play();
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
          };
          document.addEventListener('click', unlockAudio);
          document.addEventListener('keydown', unlockAudio);
        });
      };

      // Fade away intro and start music right when entering the main page
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        intro.classList.add('hide-intro');
        startMusic();
      }, 3200);

      // Starfield Animation Canvas for Section 2
      const canvas = document.getElementById('starfield-canvas');
      const ctx = canvas.getContext('2d');

      let stars = [];
      const starCount = 150;

      function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
      }

      function initStars() {
        stars = [];
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speedX: (Math.random() - 0.5) * 0.5,
            speedY: Math.random() * 0.8 + 0.2,
            color: Math.random() > 0.3 ? '#00f0ff' : '#ffe600',
            alpha: Math.random()
          });
        }
      }

      function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < stars.length; i++) {
          let s = stars[i];
          s.x += s.speedX;
          s.y += s.speedY;

          if (s.y > canvas.height) {
            s.y = 0;
            s.x = Math.random() * canvas.width;
          }
          if (s.x < 0) s.x = canvas.width;
          if (s.x > canvas.width) s.x = 0;

          ctx.save();
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(animateStars);
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        initStars();
      });

      resizeCanvas();
      initStars();
      animateStars();
    });
  </script>
  <!-- Background Audio -->
  <audio id="bg-audio" src="A.mp3" loop preload="auto"></audio>
</body>
</html>
